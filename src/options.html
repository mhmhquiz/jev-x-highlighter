<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Jev X Highlighter 設定</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="options">
  <h1>Jev X Highlighter 設定</h1>

  <section>
    <h2>Jev API キー</h2>
    <p class="muted">TypeSafe のコンソール (console.typesafe.ai) で発行したキーを入力します。このブラウザにだけ保存され、同期されません。</p>
    <div class="row">
      <input type="password" id="apiKey" autocomplete="off" placeholder="未設定">
      <button id="saveKey">保存</button>
      <button id="clearKey">削除</button>
    </div>
    <p id="keyState" class="muted"></p>
  </section>

  <section>
    <h2>判定</h2>
    <label class="field"><span>強調するしきい値 (0〜1)</span><input type="number" id="threshold" min="0" max="1" step="0.05"></label>
    <label class="field"><span>弱く強調するしきい値 (0〜1)</span><input type="number" id="weakThreshold" min="0" max="1" step="0.05"></label>
    <label class="field"><span>1 日の判定上限 (件)</span><input type="number" id="dailyLimit" min="0" step="100"></label>
  </section>

  <section>
    <h2>カテゴリ</h2>
    <p class="muted">「判定の説明」は Jev への質問文です。英語のほうが精度が出やすいとされています。キーワード・アカウントに一致したツイートは Jev の判定を待たずに強調します。</p>
    <div id="categories"></div>
    <button id="addCategory">カテゴリを追加</button>
  </section>

  <div class="actions">
    <button id="save" class="primary">保存</button>
    <button id="reset">初期設定に戻す</button>
    <span id="saved" class="muted"></span>
  </div>

  <template id="categoryTemplate">
    <div class="category">
      <div class="row">
        <input type="checkbox" data-k="enabled" title="有効">
        <input type="color" data-k="color">
        <input type="text" data-k="name" placeholder="カテゴリ名">
        <button data-action="remove">削除</button>
      </div>
      <label class="field"><span>判定の説明 (Jev への質問)</span><textarea data-k="instructions" rows="3"></textarea></label>
      <label class="field"><span>該当する例 (はい の基準)</span><textarea data-k="criteriaTrue" rows="2"></textarea></label>
      <label class="field"><span>該当しない例 (いいえ の基準)</span><textarea data-k="criteriaFalse" rows="2"></textarea></label>
      <label class="field"><span>必ず該当するキーワード (カンマ区切り)</span><input type="text" data-k="keywords"></label>
      <label class="field"><span>必ず該当するアカウント (@ID、カンマ区切り)</span><input type="text" data-k="accounts"></label>
    </div>
  </template>

  <script type="module" src="options.js"></script>
</body>
</html>
